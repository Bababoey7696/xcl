name: Test working directory fix

on:
  push:
    branches:
      - fix/test-location

permissions:
  contents: read

jobs:
  test:
    name: PowerShell regression tests
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify test fails before the fix (PowerShell 5.1)
        shell: powershell
        run: |
          $runner = Join-Path $env:GITHUB_WORKSPACE 'scripts/test.ps1'
          $old = @(git show f4ce27ceb6d1b0576d0c659b713b674778bf1968:scripts/test.ps1)
          if ($LASTEXITCODE -ne 0) { throw 'Could not load the original test.ps1' }
          [IO.File]::WriteAllLines($runner, [string[]]$old, (New-Object System.Text.UTF8Encoding($false)))
          try {
            $failure = $null
            try {
              & ./scripts/test-native-stderr.tests.ps1 *> baseline.log
            } catch {
              $failure = $_.Exception.Message
            }
            if ($failure -ne 'test.ps1 changed the caller working directory.') {
              throw "Expected the working-directory regression, got: $failure"
            }
            Write-Host "Expected pre-fix failure confirmed: $failure"
          } finally {
            git restore --source=HEAD -- scripts/test.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore the fixed test.ps1' }
          }

      - name: Test fix with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-native-stderr.tests.ps1

      - name: Test fix with PowerShell 7
        shell: pwsh
        run: ./scripts/test-native-stderr.tests.ps1

      - name: Build and test XCL (Windows, no GPU)
        shell: pwsh
        run: ./scripts/test.ps1 --skip test_title_runs_and_game_folder_is_untouched
